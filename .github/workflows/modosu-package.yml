name: Modosu Offline package
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build and test local policies
        shell: powershell
        run: |
          dotnet restore Modosu.sln --packages .cache/nuget
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build Modosu.sln --no-restore -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test osu.Game.Rulesets.Modosu.Tests/osu.Game.Rulesets.Modosu.Tests.csproj --no-build --no-restore -c Release --filter 'FullyQualifiedName~OfflinePolicyTest|FullyQualifiedName~OriginalStateStoreTest|FullyQualifiedName~SpacingAdjustTest'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./manager/tests/Test-Transitions.ps1
      - name: Prepare locked bundle (real Windows validation still required)
        shell: powershell
        run: |
          ./manager/Build-Package.ps1
          ./manager/Build-Bundle.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ModosuOffline-Windows-unvalidated
          path: artifacts/ModosuOffline-Windows.zip
